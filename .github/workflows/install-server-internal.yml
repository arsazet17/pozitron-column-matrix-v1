name: VERIFY · HYBRID 7 ROAD MARKERS · SAFE

on:
  workflow_dispatch:
  push:
    paths:
      - "internal-forecast-runner.mjs"
      - "marker-base.json"
      - "ai-analyzer.js"
      - ".github/workflows/install-server-internal.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify HYBRID 7 files
        run: |
          set -euo pipefail
          node --check internal-forecast-runner.mjs
          node --check ai-analyzer.js
          test -s marker-base.json
          grep -q "HYBRID-7.0-ROAD-MARKERS" internal-forecast-runner.mjs
          grep -q "HYBRID-7.1-ROAD-MARKERS-EXTERNAL" ai-analyzer.js
          grep -q '"version":"MARKER-ROAD-1.0"' marker-base.json
          echo "HYBRID 7 verification passed"
