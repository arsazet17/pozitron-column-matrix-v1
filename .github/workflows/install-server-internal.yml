name: INSTALL · SERVER INTERNAL

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-server-internal.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install direct server runner
        shell: python
        run: |
          from pathlib import Path
          import base64
          data = base64.b64decode("")
          Path("internal-forecast-runner.mjs").write_bytes(data)

      - name: Make phone read server INTERNAL archive
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("ai-analyzer.js")
          s=p.read_text(encoding="utf-8")

          # Add server archive fetcher once.
          marker="  function loadArchive() {"
          if "async function fetchServerInternalArchive()" not in s:
              block=r'''
  async function fetchServerInternalArchive() {
    try {
      const r = await fetch(`internal-forecast-archive.json?ts=${Date.now()}`, { cache:'no-store' });
      if (!r.ok) return;
      const server = await r.json();
      if (!Array.isArray(server)) return;
      const local = loadArchive();
      const map = new Map();
      [...local, ...server].forEach(rec => {
        const key = `${rec?.provider||'openai'}:${rec?.baseDraw}:${rec?.targetDraw}`;
        map.set(key, rec);
      });
      saveArchive([...map.values()].sort((a,b)=>Number(a?.targetDraw||0)-Number(b?.targetDraw||0)));
    } catch (_) {}
  }

'''
              if marker not in s:
                  raise SystemExit("loadArchive marker not found")
              s=s.replace(marker,block+marker,1)

          # At every UI refresh, first pull ready server forecast.
          target="    let archive = loadArchive();\n    settleArchive(archive, draws);"
          repl="    await fetchServerInternalArchive();\n    let archive = loadArchive();\n    settleArchive(archive, draws);"
          if repl not in s:
              if target not in s:
                  raise SystemExit("refresh archive block not found")
              s=s.replace(target,repl,1)

          # Keep phone from calculating INTERNAL itself.
          s=re.sub(r'\n\s*if \(fresh\) ensureInternalForecast\(draws\);','',s)

          p.write_text(s,encoding="utf-8")

          p=Path("index.html")
          h=p.read_text(encoding="utf-8")
          h=re.sub(r'<title>ПОЗИТРОН · МАТРИЦА СТОЛБОВ v[^<]+</title>',
                   '<title>ПОЗИТРОН · МАТРИЦА СТОЛБОВ v2.2.10</title>',h)
          h=re.sub(r'<small>новое отдельное приложение · v[^<]+</small>',
                   '<small>новое отдельное приложение · v2.2.10</small>',h)
          h=re.sub(r'<script src="ai-analyzer\.js\?v=[^"]+"></script>',
                   '<script src="ai-analyzer.js?v=v2210-server-internal"></script>',h)
          p.write_text(h,encoding="utf-8")

      - name: Verify
        run: |
          set -e
          node --check internal-forecast-runner.mjs
          node --check ai-analyzer.js
          grep -q "fetchServerInternalArchive" ai-analyzer.js
          grep -q "v2.2.10" index.html
          ! grep -q "if (fresh) ensureInternalForecast(draws);" ai-analyzer.js

      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal-forecast-runner.mjs ai-analyzer.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Матрица v2.2.10 · SERVER INTERNAL как M5M"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
