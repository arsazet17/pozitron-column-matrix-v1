name: Column Matrix · Stoloto MAIN

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: column-matrix-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-column-matrix-playwright-1

      - name: Dependencies
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Read Stoloto until latest due draw is caught
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        shell: bash
        run: |
          set -u
          success=0

          for attempt in 1 2 3 4 5 6; do
            echo "Column Matrix Stoloto attempt $attempt/6"

            cp keno-history.json /tmp/keno-history.before.json

            if timeout --signal=TERM --kill-after=15s 180s node stoloto-column-matrix-update.mjs; then
              success=1
              break
            fi

            echo "Reader failed; restore verified history."
            cp /tmp/keno-history.before.json keno-history.json

            if [ "$attempt" -lt 6 ]; then
              sleep 25
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "::error::Stoloto could not be updated after 6 attempts."
            exit 1
          fi

      - name: Commit DRAW immediately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- keno-history.json stoloto-status.json; then
            echo "No new draw data"
          else
            git add keno-history.json stoloto-status.json
            git commit -m "Матрица v2.3 · LIVE draw"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: INTERNAL direct Node engine
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s node internal-forecast-runner.mjs

      - name: Commit INTERNAL separately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- internal-forecast-archive.json; then
            echo "No INTERNAL changes"
            exit 0
          fi

          git add internal-forecast-archive.json
          git commit -m "Матрица v2.3 · INTERNAL forecast"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
