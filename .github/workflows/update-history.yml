name: Column Matrix · Stoloto MAIN

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: column-matrix-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Синхронизировать с актуальным main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Столото · обновить историю или записать НЕТ ОТВЕТА
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node stoloto-safe-update.mjs

      - name: Внутренний ИИ · прогноз + постоянный архив
        run: node internal-forecast-runner.mjs

      - name: Сохранить историю, статус Столото и внутренний ИИ-архив
        shell: bash
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_if_needed() {
            if git diff --quiet -- keno-history.json internal-forecast-archive.json stoloto-status.json; then
              echo "Новых изменений нет"
              return 1
            fi

            git add keno-history.json internal-forecast-archive.json stoloto-status.json
            git commit -m "Матрица столбов · история + ИИ + статус Столото"
            return 0
          }

          if ! commit_if_needed; then
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Попытка push ${attempt}/3"

            if git push origin HEAD:main; then
              echo "Push PASS"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: не удалось сохранить после 3 попыток"
              exit 1
            fi

            echo "main изменилась — беру свежую версию и пересчитываю"
            git fetch origin main
            git reset --hard origin/main

            node stoloto-safe-update.mjs
            node internal-forecast-runner.mjs

            if ! commit_if_needed; then
              echo "Другой запуск уже сохранил эти данные — PASS"
              exit 0
            fi
          done
