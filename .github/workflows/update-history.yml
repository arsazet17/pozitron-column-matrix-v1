name: Column Matrix · Stoloto MAIN

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: column-matrix-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Синхронизировать с актуальным main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Столото · безопасно обновить историю
        shell: bash
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: |
          set -u

          cp keno-history.json /tmp/keno-history.before-stoloto.json

          if node stoloto-column-matrix-update.mjs; then
            echo "СТОЛОТО: PASS"
          else
            echo "СТОЛОТО: НЕТ ОТВЕТА"
            echo "Оставляю последний проверенный keno-history.json"
            cp /tmp/keno-history.before-stoloto.json keno-history.json
          fi

          exit 0

      - name: Внутренний ИИ · постоянный прогноз и архив
        run: node internal-forecast-runner.mjs

      # ВАЖНО — как в M5M:
      # тиражный AUTO не трогает index.html и версии JS.
      # Поэтому обновление данных НЕ запускает пересборку Pages.
      # Телефон читает keno-history.json и internal-forecast-archive.json
      # напрямую из raw.githubusercontent.com/main с cache:no-store.
      - name: Сохранить LIVE данные сразу
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_if_needed() {
            if git diff --quiet -- keno-history.json internal-forecast-archive.json; then
              echo "Новых LIVE-данных нет"
              return 1
            fi

            git add keno-history.json internal-forecast-archive.json
            git commit -m "Матрица v2.2.1 · LIVE Stoloto runtime"
            return 0
          }

          if ! commit_if_needed; then
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Попытка push ${attempt}/3"

            if git push origin HEAD:main; then
              echo "LIVE Push PASS"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: push не прошёл после 3 попыток"
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main

            cp keno-history.json /tmp/keno-history.before-retry.json

            if ! node stoloto-column-matrix-update.mjs; then
              cp /tmp/keno-history.before-retry.json keno-history.json
            fi

            node internal-forecast-runner.mjs

            if ! commit_if_needed; then
              echo "Другой запуск уже сохранил LIVE-данные — PASS"
              exit 0
            fi
          done
