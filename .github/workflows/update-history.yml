name: Update KENO history

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: update-keno-history
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and merge fresh KENO history
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          SOURCE = (
              "https://raw.githubusercontent.com/"
              "arsazet17/pozitron-keno-v72/main/keno-history.json"
          )
          TARGET = Path("keno-history.json")

          def valid(row):
              try:
                  draw = int(row.get("draw"))
                  balls = [int(x) for x in row.get("balls", [])]
              except Exception:
                  return False

              return (
                  draw > 0
                  and len(balls) == 20
                  and len(set(balls)) == 20
                  and all(1 <= n <= 80 for n in balls)
              )

          def normalize(row):
              return {
                  "draw": int(row["draw"]),
                  "date": str(row.get("date", "")),
                  "time": str(row.get("time", "")),
                  "balls": [int(x) for x in row["balls"]],
              }

          local = []
          if TARGET.exists():
              try:
                  local = json.loads(TARGET.read_text(encoding="utf-8"))
              except Exception:
                  local = []

          url = f"{SOURCE}?t={int(time.time())}"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 Positron-KENO-Updater/1.0",
                  "Accept": "application/json,text/plain,*/*",
              },
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              remote = json.loads(response.read().decode("utf-8"))

          if not isinstance(remote, list) or not remote:
              raise SystemExit("Remote history is empty or invalid")

          merged = {}

          for row in local:
              if isinstance(row, dict) and valid(row):
                  item = normalize(row)
                  merged[item["draw"]] = item

          before = set(merged)

          for row in remote:
              if isinstance(row, dict) and valid(row):
                  item = normalize(row)
                  merged[item["draw"]] = item

          result = [merged[k] for k in sorted(merged)]
          after = set(merged)

          added = sorted(after - before)

          if not result:
              raise SystemExit("Merged history is empty")

          TARGET.write_text(
              json.dumps(result, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )

          print(f"Local valid draws before: {len(before)}")
          print(f"Remote rows received: {len(remote)}")
          print(f"Merged valid draws: {len(result)}")
          print(f"Added draws: {len(added)}")
          if added:
              print(f"Added range: {added[0]} .. {added[-1]}")
          print(f"Latest draw: {result[-1]['draw']}")
          PY

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("keno-history.json").read_text(encoding="utf-8")
          )

          if not isinstance(data, list) or not data:
              raise SystemExit("keno-history.json is empty")

          previous = None
          seen = set()

          for row in data:
              draw = int(row["draw"])
              balls = [int(x) for x in row["balls"]]

              if draw in seen:
                  raise SystemExit(f"Duplicate draw: {draw}")

              if len(balls) != 20 or len(set(balls)) != 20:
                  raise SystemExit(f"Draw {draw}: invalid balls")

              if any(n < 1 or n > 80 for n in balls):
                  raise SystemExit(f"Draw {draw}: ball outside 1..80")

              if previous is not None and draw <= previous:
                  raise SystemExit(
                      f"History is not sorted: {previous} -> {draw}"
                  )

              seen.add(draw)
              previous = draw

          print(
              f"JSON OK: {len(data)} draws; "
              f"latest draw #{data[-1]['draw']}"
          )
          PY

      - name: Commit only when history changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- keno-history.json; then
            echo "No new KENO draws"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add keno-history.json
          git commit -m "Auto-update KENO history"
          git push
