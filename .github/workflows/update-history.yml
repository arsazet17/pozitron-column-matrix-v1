name: Column Matrix · Stoloto MAIN

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: column-matrix-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Синхронизировать с актуальным main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Столото · обновить историю безопасно
        shell: bash
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: |
          set -u

          # Сохраняем гарантированно рабочую историю перед обращением к Столото.
          cp keno-history.json /tmp/keno-history.before-stoloto.json

          if node stoloto-column-matrix-update.mjs; then
            echo "СТОЛОТО: ответ получен"
          else
            echo "СТОЛОТО: НЕТ ОТВЕТА / ВРЕМЕННАЯ ОШИБКА"
            echo "Сохраняю предыдущий проверенный архив без изменений"
            cp /tmp/keno-history.before-stoloto.json keno-history.json
          fi

          # Этот шаг намеренно завершается успешно:
          # временная недоступность Столото не должна ломать приложение.

      - name: Сохранить только проверенные новые тиражи
        shell: bash
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_if_needed() {
            if git diff --quiet -- keno-history.json; then
              echo "Новых проверенных тиражей нет. Старый архив сохранён."
              return 1
            fi

            git add keno-history.json
            git commit -m "Столото · Матрица столбов · автообновление"
            return 0
          }

          if ! commit_if_needed; then
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Попытка push ${attempt}/3"

            if git push origin HEAD:main; then
              echo "Push PASS"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: не удалось сохранить после 3 попыток"
              exit 1
            fi

            echo "main изменилась — беру свежую версию"
            git fetch origin main
            git reset --hard origin/main

            cp keno-history.json /tmp/keno-history.before-retry.json
            if ! node stoloto-column-matrix-update.mjs; then
              echo "СТОЛОТО: нет ответа при повторе — сохраняю текущий архив"
              cp /tmp/keno-history.before-retry.json keno-history.json
            fi

            if ! commit_if_needed; then
              echo "Другой запуск уже сохранил данные или новых данных нет — PASS"
              exit 0
            fi
          done
