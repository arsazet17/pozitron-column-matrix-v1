name: v2.2.4 · FIX APP HANG

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-v224-app-hang.yml"

permissions:
  contents: write

concurrency:
  group: v224-fix-app-hang
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Remove duplicate AI loader and bump version
        shell: python
        run: |
          from pathlib import Path
          import re

          # matrix.js загружал ai-analyzer.js ВТОРОЙ РАЗ.
          # В index.html он уже подключён штатно.
          p = Path("matrix.js")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'\n\s*function ensureOfficialAiModule\(\)\s*\{.*?\n\s*\}\n',
              '\n',
              s,
              flags=re.S
          )
          s = re.sub(r'\n\s*ensureOfficialAiModule\(\);\s*', '\n', s)

          p.write_text(s, encoding="utf-8")

          # Версия
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'<title>ПОЗИТРОН · МАТРИЦА СТОЛБОВ v[^<]+</title>',
              '<title>ПОЗИТРОН · МАТРИЦА СТОЛБОВ v2.2.4</title>',
              s
          )
          s = re.sub(
              r'<small>новое отдельное приложение · v[^<]+</small>',
              '<small>новое отдельное приложение · v2.2.4</small>',
              s
          )

          # Принудительно обновляем matrix.js на телефоне.
          s = re.sub(
              r'<script src="matrix\.js\?v=[^"]+"></script>',
              '<script src="matrix.js?v=v224-no-double-ai-20260827"></script>',
              s
          )

          p.write_text(s, encoding="utf-8")

      - name: Verify only one AI loader
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "ensureOfficialAiModule" matrix.js; then
            echo "::error::duplicate AI loader still exists"
            exit 1
          fi
          grep -n "ai-analyzer.js" index.html

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add matrix.js index.html

          if git diff --cached --quiet; then
            echo "Already fixed"
            exit 0
          fi

          git commit -m "Матрица v2.2.4 · убрать двойной запуск ИИ"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
