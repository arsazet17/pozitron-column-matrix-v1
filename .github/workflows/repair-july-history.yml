name: Repair July KENO dates

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-july-keno-dates
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore 22 and 26 July from Lucky Numbers
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/repair-july.js <<'NODE'
          'use strict';

          const fs = require('fs');

          const HISTORY_FILE = 'keno-history.json';
          const BASE = 'https://lucky-numbers.ru/lottery/ru/keno2';
          const TARGET_DATES = [
            { iso: '2026-07-22', ru: '22.07.26' },
            { iso: '2026-07-26', ru: '26.07.26' }
          ];

          function stripTags(value) {
            return String(value || '')
              .replace(/<script[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style[\s\S]*?<\/style>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;|&#160;/gi, ' ')
              .replace(/&quot;/gi, '"')
              .replace(/&amp;/gi, '&')
              .replace(/\s+/g, ' ')
              .trim();
          }

          function valid(row) {
            const draw = Number(row?.draw);
            const balls = Array.isArray(row?.balls) ? row.balls.map(Number) : [];
            return Number.isInteger(draw) &&
              draw > 0 &&
              balls.length === 20 &&
              new Set(balls).size === 20 &&
              balls.every(n => n >= 1 && n <= 80);
          }

          function normalize(row) {
            return {
              draw: Number(row.draw),
              date: String(row.date || ''),
              time: String(row.time || ''),
              balls: row.balls.map(Number)
            };
          }

          function candidateUrl(isoDate, hour, minute) {
            const [year, month, day] = isoDate.split('-').map(Number);

            // Lucky Numbers uses a millisecond timestamp corresponding to
            // Moscow local draw time (UTC+3) plus 30 seconds.
            const utcMs = Date.UTC(
              year,
              month - 1,
              day,
              hour - 3,
              minute,
              30
            );

            return `${BASE}/${utcMs}`;
          }

          function parsePage(html, expectedRuDate) {
            const text = stripTags(html);

            const drawMatch =
              text.match(/Результаты\s+тиража\s*№\s*([\d\s\u00a0]{5,9})/i) ||
              text.match(/Тираж\s*№\s*([\d\s\u00a0]{5,9})\s+лотереи\s+КЕНО/i);

            if (!drawMatch) return null;

            const draw = Number(drawMatch[1].replace(/\s|\u00a0/g, ''));

            const months = {
              января: 1, февраля: 2, марта: 3, апреля: 4,
              мая: 5, июня: 6, июля: 7, августа: 8,
              сентября: 9, октября: 10, ноября: 11, декабря: 12
            };

            const dt = text.match(
              /от\s+(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)\s+(\d{4})\s*(?:г\.?)?\s+в\s+(\d{1,2}):(\d{2})/i
            );

            if (!dt) return null;

            const date =
              `${String(dt[1]).padStart(2, '0')}.` +
              `${String(months[dt[2].toLowerCase()]).padStart(2, '0')}.` +
              `${String(dt[3]).slice(-2)}`;

            if (date !== expectedRuDate) return null;

            const time =
              `${String(dt[4]).padStart(2, '0')}:${String(dt[5]).padStart(2, '0')}`;

            const marker = html.search(/Выпавшие\s+числа/i);
            if (marker < 0) return null;

            let segment = html.slice(marker);
            const end = segment.search(/Проверить\s+билет/i);
            if (end > 0) segment = segment.slice(0, end);

            const balls = [];
            const buttonPattern =
              /<button\b[^>]*>\s*(\d{1,2})\s*<\/button>/gi;

            let match;
            while ((match = buttonPattern.exec(segment)) && balls.length < 20) {
              const number = Number(match[1]);
              if (number >= 1 && number <= 80) balls.push(number);
            }

            const row = { draw, date, time, balls };
            return valid(row) ? row : null;
          }

          async function fetchOne(url, expectedRuDate) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 10000);

            try {
              const response = await fetch(url, {
                redirect: 'follow',
                signal: controller.signal,
                headers: {
                  'user-agent':
                    'Mozilla/5.0 GitHub-Actions Positron-July-Repair/1.0',
                  accept: 'text/html,application/xhtml+xml',
                  'accept-language': 'ru-RU,ru;q=0.9'
                }
              });

              if (!response.ok) return null;
              const html = await response.text();
              return parsePage(html, expectedRuDate);
            } catch (_) {
              return null;
            } finally {
              clearTimeout(timer);
            }
          }

          async function runPool(items, worker, concurrency = 6) {
            const results = new Array(items.length);
            let next = 0;

            async function runner() {
              while (true) {
                const index = next++;
                if (index >= items.length) return;
                results[index] = await worker(items[index]);
              }
            }

            await Promise.all(
              Array.from({ length: concurrency }, () => runner())
            );

            return results;
          }

          async function main() {
            const original = JSON.parse(
              fs.readFileSync(HISTORY_FILE, 'utf8')
            );

            if (!Array.isArray(original) || !original.length) {
              throw new Error('keno-history.json пуст');
            }

            const map = new Map();

            for (const row of original) {
              if (valid(row)) {
                const item = normalize(row);
                map.set(item.draw, item);
              }
            }

            const beforeCount = map.size;
            const candidates = [];

            for (const target of TARGET_DATES) {
              for (let hour = 0; hour < 24; hour += 1) {
                for (const minute of [17, 47]) {
                  candidates.push({
                    ...target,
                    hour,
                    minute,
                    url: candidateUrl(target.iso, hour, minute)
                  });
                }
              }
            }

            const recovered = (
              await runPool(
                candidates,
                item => fetchOne(item.url, item.ru),
                6
              )
            ).filter(Boolean);

            const uniqueRecovered = [
              ...new Map(recovered.map(row => [row.draw, row])).values()
            ].sort((a, b) => a.draw - b.draw);

            if (!uniqueRecovered.length) {
              throw new Error(
                'Lucky Numbers не вернул ни одного подтверждённого тиража — файл не меняем'
              );
            }

            for (const row of uniqueRecovered) {
              // Намеренно заменяем запись того же номера:
              // так восстанавливаются правильные дата и время.
              map.set(row.draw, row);
            }

            const repaired = [...map.values()]
              .sort((a, b) => a.draw - b.draw);

            if (repaired.length < beforeCount) {
              throw new Error('Защита: количество тиражей уменьшилось');
            }

            for (const row of repaired) {
              if (!valid(row)) {
                throw new Error(`Некорректный тираж №${row.draw}`);
              }
            }

            const byTarget = {};
            for (const target of TARGET_DATES) {
              byTarget[target.ru] = uniqueRecovered
                .filter(row => row.date === target.ru)
                .map(row => `${row.draw}@${row.time}`);
            }

            console.log(
              'Подтверждено с Lucky Numbers:',
              JSON.stringify(byTarget, null, 2)
            );

            for (const target of TARGET_DATES) {
              const count = byTarget[target.ru].length;
              if (count < 10) {
                throw new Error(
                  `Защита: для ${target.ru} найдено только ${count} тиражей; commit отменён`
                );
              }
            }

            fs.writeFileSync(
              HISTORY_FILE,
              JSON.stringify(repaired),
              'utf8'
            );

            console.log(`До ремонта: ${beforeCount}`);
            console.log(`После ремонта: ${repaired.length}`);
            console.log(
              `Восстановлено/уточнено: ${uniqueRecovered.length} записей`
            );
          }

          main().catch(error => {
            console.error(error.stack || error.message || error);
            process.exit(1);
          });
          NODE

          node --check /tmp/repair-july.js
          node /tmp/repair-july.js

      - name: Validate repaired history
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('keno-history.json').read_text(encoding='utf-8')
          )

          if not isinstance(data, list) or not data:
              raise SystemExit('History is empty')

          seen = set()
          for row in data:
              draw = int(row['draw'])
              balls = [int(x) for x in row['balls']]

              if draw in seen:
                  raise SystemExit(f'Duplicate draw: {draw}')
              if len(balls) != 20 or len(set(balls)) != 20:
                  raise SystemExit(f'Draw {draw}: invalid balls')
              if any(x < 1 or x > 80 for x in balls):
                  raise SystemExit(f'Draw {draw}: ball outside 1..80')

              seen.add(draw)

          target_dates = {'22.07.26', '26.07.26'}
          found = {
              date: sum(1 for row in data if str(row.get('date', '')) == date)
              for date in target_dates
          }

          print('Target-date rows:', found)

          if any(count < 10 for count in found.values()):
              raise SystemExit(
                  'Safety check failed: too few restored rows for target dates'
              )

          print(f'JSON OK: {len(data)} draws')
          PY

      - name: Commit only the repaired history
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- keno-history.json; then
            echo "No July history changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add keno-history.json
          git commit -m "Repair KENO dates for 22 and 26 July"
          git push
