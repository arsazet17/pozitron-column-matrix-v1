name: v2.2.2 · PWA install fix
on:
  workflow_dispatch:
  push:
    paths:
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - ".github/workflows/install-v222-pwa.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          s=re.sub(r'<title>ПОЗИТРОН · МАТРИЦА СТОЛБОВ v[^<]+</title>','<title>ПОЗИТРОН · МАТРИЦА СТОЛБОВ v2.2.2</title>',s)
          s=re.sub(r'<small>новое отдельное приложение · v[^<]+</small>','<small>новое отдельное приложение · v2.2.2</small>',s)
          if 'apple-touch-icon' not in s:
              s=s.replace('<link rel="icon" href="icon.svg" type="image/svg+xml">','<link rel="icon" href="icon.svg" type="image/svg+xml">\n<link rel="apple-touch-icon" href="icons/icon-192.png">')
          s=re.sub(r'\s*<script id="column-pwa-register">.*?</script>','',s,flags=re.S)
          reg='''<script id="column-pwa-register">
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("./sw.js?v=v222-20260827",{updateViaCache:"none"});
      await reg.update();
    } catch(e) { console.warn("PWA SW:", e); }
  });
}
</script>'''
          s=s.replace('</body>',reg+'\n</body>')
          p.write_text(s,encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js icons/icon-192.png icons/icon-512.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Матрица v2.2.2 · PWA install fix"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
