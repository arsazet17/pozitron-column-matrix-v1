name: INSTALL · Matrix M5M Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matrix-m5m-refresh-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить M5M refresh
        run: node install-matrix-m5m-refresh.cjs

      - name: Пересчитать хэши JS
        run: node refresh-asset-versions.mjs

      - name: Проверка
        run: |
          grep -q "v2.2.16" index.html
          grep -q "60000" matrix.js
          grep -q "matrix-sw-controllerchange-v2216" index.html
          grep -q "raw.githubusercontent.com" sw.js
          echo "CHECK PASS"

      - name: Сохранить
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html matrix.js sw.js refresh-asset-versions.mjs; then
            echo "Изменений нет"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html matrix.js sw.js refresh-asset-versions.mjs
          git commit -m "Матрица v2.2.16 · M5M refresh + auto JS hash"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "INSTALL PASS"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "INSTALL FAIL"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
