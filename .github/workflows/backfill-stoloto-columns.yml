name: Column Matrix · Stoloto BACKFILL 32 DAYS · ONE PASS FIX

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: column-matrix-stoloto-auto
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Столото · backfill 32 даты · ОДИН ПРОХОД + точечный добор
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node stoloto-column-matrix-backfill.mjs

      - name: Сохранить официальный backfill
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- keno-history.json; then
            echo "Изменений нет — column/parity уже заполнены"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keno-history.json
          git commit -m "Столото · backfill 32 дня · one pass fix"
          git push
